apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stellarpay-production
  labels:
    app: backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
      - name: backend
        image: ghcr.io/omolobamoyinoluwa-max/stellarpay-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: STELLAR_NETWORK
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: stellar-network
        - name: HORIZON_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: horizon-url
        - name: PORT
          value: "8080"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stellarpay-production
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
