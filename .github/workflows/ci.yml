name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, enhancement/* ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.24'
  RUST_VERSION: '1.75'

jobs:
  # Frontend CI Job
  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
        
    - name: Install dependencies
      working-directory: ./client
      run: npm ci
      
    - name: Run ESLint
      working-directory: ./client
      run: npm run lint
      
    - name: Type check
      working-directory: ./client
      run: npx tsc --noEmit
      
    - name: Build application
      working-directory: ./client
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: client/dist/
        retention-days: 7

  # Backend CI Job
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: Go-Sdk/go.sum
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('Go-Sdk/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Download dependencies
      working-directory: ./Go-Sdk
      run: go mod download
      
    - name: Verify dependencies
      working-directory: ./Go-Sdk
      run: go mod verify
      
    - name: Run tests
      working-directory: ./Go-Sdk
      run: go test -v -race -coverprofile=coverage.out ./...
      
    - name: Run benchmark
      working-directory: ./Go-Sdk
      run: go test -bench=. -benchmem ./...
      
    - name: Build application
      working-directory: ./Go-Sdk
      run: go build -v -o stellar-pay-server .
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-binary
        path: Go-Sdk/stellar-pay-server
        retention-days: 7

  # Smart Contracts CI Job
  smart-contracts:
    name: Smart Contracts (Rust/Soroban)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt, clippy
        
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          early-wager-contract/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('early-wager-contract/**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install Stellar CLI
      run: |
        wget -qO- https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-linux-x86_64.tar.gz | tar xz
        sudo mv stellar /usr/local/bin/
        
    - name: Format check
      working-directory: ./early-wager-contract
      run: cargo fmt --all -- --check
      
    - name: Clippy lint
      working-directory: ./early-wager-contract
      run: cargo clippy --all-targets --all-features -- -D warnings
      
    - name: Run tests
      working-directory: ./early-wager-contract
      run: cargo test --all
      
    - name: Build early-wage contract
      working-directory: ./early-wager-contract/contracts/early-wage
      run: make build
      
    - name: Build token contract
      working-directory: ./early-wager-contract/contracts/token
      run: make build
      
    - name: Upload contract artifacts
      uses: actions/upload-artifact@v4
      with:
        name: contract-wasm
        path: |
          early-wager-contract/contracts/early-wage/target/wasm32-unknown-unknown/release/*.wasm
          early-wager-contract/contracts/token/target/wasm32-unknown-unknown/release/*.wasm
        retention-days: 7

  # Security Scanning Job
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [frontend, backend, smart-contracts]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: npm audit (frontend)
      working-directory: ./client
      run: npm audit --audit-level moderate
      
    - name: Go security audit
      run: |
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        gosec ./Go-Sdk/...
        
    - name: Rust security audit
      uses: actions-rs/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Integration Tests Job
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend, smart-contracts]
    
    services:
      stellar:
        image: stellar/quickstart:latest
        ports:
          - 8000:8000
        env:
          STELLAR_NETWORK: TESTNET
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: client/dist/
        
    - name: Download backend binary
      uses: actions/download-artifact@v4
      with:
        name: backend-binary
        path: Go-Sdk/
        
    - name: Start backend server
      working-directory: ./Go-Sdk
      run: |
        chmod +x stellar-pay-server
        ./stellar-pay-server &
        sleep 5
        
    - name: Run integration tests
      run: |
        # Add integration test commands here
        echo "Running integration tests..."
        curl -f http://localhost:8080/api/health || exit 1

  # Deploy Job (only on main branch)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend, backend, smart-contracts, security, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Deploy frontend
      run: |
        echo "Deploying frontend to production..."
        # Add frontend deployment commands here
        
    - name: Deploy backend
      run: |
        echo "Deploying backend to production..."
        # Add backend deployment commands here
        
    - name: Deploy smart contracts
      run: |
        echo "Deploying smart contracts to Stellar Testnet..."
        # Add contract deployment commands here

  # Notify on failure
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [frontend, backend, smart-contracts, security, integration]
    if: failure()
    
    steps:
    - name: Notify team
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ci-cd'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
